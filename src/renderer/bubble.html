<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>Capri bubble</title><link rel="stylesheet" href="bubble.css"></head>
<body><section id="card" aria-label="Chat with Capri">
  <header><span id="status">CAPRI</span><nav><button id="reply" aria-label="Reply" title="Reply">↵</button><button id="settings" aria-label="Open settings" title="Settings">⚙</button><button id="close" aria-label="Dismiss bubble" title="Close (Escape)">×</button></nav></header>
  <div id="message" role="log" aria-live="polite"></div>
  <form id="composer" hidden><textarea id="input" rows="1" maxlength="20000" aria-label="Message Capri" placeholder="Say something…"></textarea><button id="stop" type="button" hidden aria-label="Stop">■</button><button id="send" aria-label="Send" type="submit">↗</button></form>
</section><script src="bubble.js"></script></body></html>
