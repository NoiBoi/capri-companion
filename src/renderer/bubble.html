<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'"><title>Capri bubble</title><link rel="stylesheet" href="bubble.css"></head>
<body><section id="card" aria-label="Chat with Capri"><div id="plate">
  <figure id="portrait-frame"><img id="portrait" src="capri/mochiiwuff/face-calm.png" alt="Capri's expression"></figure>
  <div id="content"><header><span id="who">CAPRI</span><span id="status">READY</span></header>
    <div id="message" role="log" aria-live="polite"></div>
    <div id="activity" role="progressbar" aria-label="Waiting for reply" hidden><span></span></div>
    <footer><span id="detail"></span><nav><button id="retire" aria-label="Don't say this again" title="Retire this line">⊘</button><button id="reply" aria-label="Reply" title="Reply">↵</button><button id="settings" aria-label="Open settings" title="Settings">⚙</button><button id="close" aria-label="Dismiss bubble" title="Close (Escape)">×</button></nav></footer>
  </div>
  <form id="composer" hidden><textarea id="input" rows="1" maxlength="20000" aria-label="Message Capri" placeholder="Say something..."></textarea><button id="stop" type="button" hidden aria-label="Stop">■</button><button id="send" aria-label="Send" type="submit">↗</button></form>
</div></section><svg id="tail" aria-hidden="true"><polygon></polygon></svg><script src="bubble.js"></script></body></html>
