<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Capri</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'"><link rel="stylesheet" href="taskbar.css"><link rel="stylesheet" href="theme.css"></head><body><main>
<header><div class="eyebrow">DESKTOP COMPANION <span>CAPRI</span></div><div class="identity"><img src="capri/mochiiwuff/icon.png" alt="Capri"><div><h1>Capri<span>✦</span></h1><p>A little company. A little chaos.</p></div></div></header>
<section aria-label="Companion controls"><div class="modes" role="group" aria-label="Behavior mode"><button data-mode="normal" data-command="normal" aria-pressed="false">Company</button><button data-mode="explore" data-command="explore" aria-pressed="false">Explore</button><button data-mode="sleep" data-command="sleep" aria-pressed="false">Sleep</button></div><p id="mode-hint"></p><button class="primary" aria-label="Talk to Capri" data-command="open"><span>Talk to Capri<small>Bring her back and open chat</small></span><b>↗</b></button>
<div class="row"><button aria-label="Open conversation" data-command="chat"><span>Conversation<small>History and full chat</small></span><b>↗</b></button><button aria-label="Settings" data-command="settings"><span>Settings<small>Presence, voice and access</small></span><b>⚙</b></button></div>
<button class="subtle" aria-label="Hide Capri" data-command="minimize"><span>Hide Capri<small>Give the desktop some space</small></span><b>−</b></button></section>
<footer><button class="replay" aria-label="Replay opening" data-command="intro">Replay opening <span>✦</span></button><p>Minimizing this panel leaves Capri on your desktop.</p><button class="quit" aria-label="Quit Capri" data-command="quit">Quit Capri <span>↗</span></button><p id="error" role="alert"></p></footer>
</main><script src="taskbar.js"></script></body></html>
