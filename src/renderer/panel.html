<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'" />
  <title>Capri</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="titlebar">
    <div class="wordmark" id="wordmark">CAPRI</div>
    <span class="spacer"></span>
    <span class="chip" id="connChip" data-state="disconnected" title="AI connection"><span class="gem"></span><span id="connText">offline</span></span>
    <span class="chip" id="phaseChip" data-phase="idle" title="What Capri is doing"><span class="gem"></span><span id="phaseText">ready</span></span>
    <button class="win-btn" id="closeBtn" title="Close panel (Esc)" aria-label="Close panel"></button>
  </header>
  <div class="shell">
    <nav class="rail" id="rail" role="tablist" aria-label="Sections"></nav>
    <main id="view"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="panel.js"></script>
</body>
</html>
